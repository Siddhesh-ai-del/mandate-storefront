# One-command demo for judges: `docker compose up` → http://localhost:5173
services:
  mandate-storefront:
    build: .
    ports:
      - "5173:5173"
    # Optional live integrations: create .env on the host (see .env.example).
    # `required: false` keeps the zero-credential path working when it's absent.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
